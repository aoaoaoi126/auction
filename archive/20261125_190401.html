<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta
  name="viewport"
  content="width=device-width, initial-scale=1, viewport-fit=cover"
>
<meta name="robots" content="noindex, nofollow">
<title>ヤフオク 新規入札商品</title>

<style>
:root {
  --bg:#f4f5f7;
  --card:#ffffff;
  --text:#202124;
  --muted:#6b7280;
  --line:#dde1e7;
  --accent:#7b1fa2;
  --accent-dark:#5b1478;
  --brand:#175cd3;
  --ladies:#14804a;
  --bid:#b42318;
  --free:#067647;
}

* {
  box-sizing:border-box;
}

html {
  scroll-behavior:smooth;
}

body {
  margin:0;
  color:var(--text);
  background:var(--bg);
  font-family:
    -apple-system,
    BlinkMacSystemFont,
    "Segoe UI",
    "Noto Sans JP",
    sans-serif;
}

button,
input,
select {
  font:inherit;
}

header {
  position:static;
  background:var(--bg);
  border-bottom:1px solid var(--line);
}

.wrap {
  width:min(1500px,100%);
  margin:0 auto;
  padding:14px 14px 30px;
}

h1 {
  margin:0;
  font-size:23px;
  line-height:1.25;
}

.updated {
  margin-top:4px;
  color:var(--muted);
  font-size:12px;
}

.stats {
  display:flex;
  gap:8px;
  overflow-x:auto;
  padding:12px 0 3px;
  scrollbar-width:none;
}

.stats::-webkit-scrollbar {
  display:none;
}

.stat {
  flex:0 0 auto;
  min-width:104px;
  padding:9px 11px;
  background:#fff;
  border:1px solid var(--line);
  border-radius:12px;
  font-size:12px;
}

.stat b {
  display:block;
  margin-top:2px;
  font-size:18px;
}

.filter-panel {
  margin-top:10px;
}

.filter-panel > summary {
  display:flex;
  align-items:center;
  justify-content:space-between;
  min-height:42px;
  padding:0 12px;
  color:var(--accent-dark);
  background:#fff;
  border:1px solid var(--line);
  border-radius:10px;
  font-size:14px;
  font-weight:800;
  cursor:pointer;
  list-style:none;
}

.filter-panel > summary::-webkit-details-marker {
  display:none;
}

.filter-panel > summary::after {
  content:"▼";
  margin-left:10px;
  font-size:12px;
  transition:transform .18s ease;
}

.filter-panel[open] > summary::after {
  transform:rotate(180deg);
}

.controls {
  display:grid;
  grid-template-columns:minmax(250px,2fr) repeat(4,minmax(135px,1fr));
  gap:8px;
  margin-top:8px;
}

input,
select {
  width:100%;
  min-height:43px;
  padding:0 11px;
  color:var(--text);
  background:#fff;
  border:1px solid var(--line);
  border-radius:10px;
  font-size:14px;
  outline:none;
}

input:focus,
select:focus {
  border-color:var(--accent);
  box-shadow:0 0 0 3px rgba(123,31,162,.12);
}

main.wrap {
  padding-top:16px;
}

.grid {
  display:grid;
  grid-template-columns:repeat(auto-fill,minmax(225px,1fr));
  gap:14px;
}

.card {
  display:flex;
  flex-direction:column;
  min-width:0;
  overflow:hidden;
  background:var(--card);
  border:1px solid var(--line);
  border-radius:14px;
  box-shadow:0 2px 8px rgba(0,0,0,.045);
}

.image-box {
  position:relative;
  aspect-ratio:1 / 1;
  overflow:hidden;
  background:#fff;
}

.image-box img {
  display:block;
  width:100%;
  height:100%;
  object-fit:contain;
  background:#fff;
}

.image-box img.image-fallback {
  object-fit:cover;
}

.badges {
  position:absolute;
  top:8px;
  left:8px;
  right:8px;
  display:flex;
  align-items:flex-start;
  justify-content:space-between;
  gap:7px;
}

.badge {
  display:inline-flex;
  align-items:center;
  min-height:26px;
  padding:5px 8px;
  color:#fff;
  border-radius:999px;
  font-size:10px;
  line-height:1.1;
  font-weight:800;
  box-shadow:0 1px 5px rgba(0,0,0,.2);
}

.badge.brand {
  background:var(--brand);
}

.badge.ladies {
  background:var(--ladies);
}

.badge.bid {
  margin-left:auto;
  background:var(--bid);
  font-size:12px;
}

.card-body {
  display:flex;
  flex:1;
  flex-direction:column;
  gap:7px;
  padding:11px;
}

.title {
  display:-webkit-box;
  min-height:57px;
  overflow:hidden;
  color:#333;
  font-size:13px;
  line-height:1.48;
  -webkit-line-clamp:3;
  -webkit-box-orient:vertical;
}

.info-row {
  display:flex;
  align-items:flex-start;
  justify-content:space-between;
  gap:8px;
  color:var(--muted);
  font-size:11px;
}

.price {
  color:var(--text);
  font-size:21px;
  font-weight:900;
  letter-spacing:-.02em;
}

.postage {
  min-height:17px;
  color:var(--muted);
  font-size:11px;
}

.postage.free {
  color:var(--free);
  font-weight:800;
}

.open {
  display:block;
  margin-top:auto;
  padding:10px 8px;
  color:#fff;
  background:var(--accent);
  border-radius:10px;
  text-align:center;
  text-decoration:none;
  font-size:13px;
  font-weight:800;
}

.open:hover {
  background:var(--accent-dark);
}

.copy-title {
  width:100%;
  min-height:36px;
  padding:8px;
  color:#5b1478;
  background:#faf5ff;
  border:1px solid #d8b4fe;
  border-radius:10px;
  font-size:12px;
  font-weight:800;
  cursor:pointer;
}

.copy-title:hover {
  background:#f3e8ff;
}

.exclude-seller {
  width:100%;
  min-height:38px;
  padding:8px;
  color:#b42318;
  background:#fff;
  border:1px solid #f3b7b2;
  border-radius:10px;
  font-size:12px;
  font-weight:800;
  cursor:pointer;
}

.exclude-seller:hover {
  background:#fff1f0;
}

.exclude-seller:disabled {
  color:var(--muted);
  background:#f5f5f5;
  border-color:var(--line);
  cursor:not-allowed;
}

.empty {
  display:none;
  padding:60px 12px;
  color:var(--muted);
  text-align:center;
}

footer {
  padding-top:22px;
  color:var(--muted);
  font-size:11px;
  line-height:1.6;
  word-break:break-all;
}

@media (max-width:900px) {
  .controls {
    grid-template-columns:1fr 1fr 1fr;
  }

  .controls .search {
    grid-column:1 / -1;
  }
}

@media (max-width:720px) {
  .wrap {
    padding-left:9px;
    padding-right:9px;
  }

  h1 {
    font-size:19px;
  }

  .updated {
    font-size:11px;
  }

  .controls {
    grid-template-columns:1fr 1fr;
  }

  .controls .search {
    grid-column:1 / -1;
  }

  .grid {
    grid-template-columns:repeat(3,minmax(0,1fr));
    gap:5px;
  }

  .card {
    border-radius:11px;
  }

  .card-body {
    gap:4px;
    padding:5px;
  }

  .title {
    min-height:40px;
    font-size:9.5px;
    line-height:1.4;
  }

  .price {
    font-size:14px;
  }

  .info-row,
  .postage {
    font-size:8px;
  }

  .badge {
    min-height:18px;
    padding:3px 4px;
    font-size:7.5px;
  }

  .badge.bid {
    font-size:8px;
  }

  .open {
    padding:7px 3px;
    font-size:9px;
  }

  .copy-title {
    min-height:28px;
    padding:5px 3px;
    border-radius:7px;
    font-size:8px;
    line-height:1.2;
  }

  .exclude-seller {
    min-height:29px;
    padding:5px 3px;
    font-size:8px;
    line-height:1.25;
  }
}
</style>
</head>

  if (!title) {
    alert("コピーするタイトルがありません。");
    return;
  }

  const originalLabel = buttonElement.textContent;

  try {
    if (navigator.clipboard && window.isSecureContext) {
      await navigator.clipboard.writeText(title);
    } else {
      const textArea = document.createElement("textarea");
      textArea.value = title;
      textArea.setAttribute("readonly", "");
      textArea.style.position = "fixed";
      textArea.style.left = "-9999px";
      document.body.appendChild(textArea);
      textArea.select();

      const copied = document.execCommand("copy");
      textArea.remove();

      if (!copied) {
        throw new Error("copy failed");
      }
    }

    buttonElement.textContent = "コピー済み";
    buttonElement.disabled = true;

    setTimeout(() => {
      buttonElement.textContent = originalLabel;
      buttonElement.disabled = false;
    }, 1200);

  } catch (error) {
    window.prompt("タイトルをコピーしてください", title);
  }
}

function formatYen(value) {
  if (
    value === null ||
    value === "" ||
    Number.isNaN(Number(value))
  ) {
    return "価格不明";
  }

  return "¥" + Number(value).toLocaleString("ja-JP");
}

function isFreeShipping(item) {
  const text = String(item.postage_text || "");

  return (
    Number(item.postage) === 0 ||
    text.includes("送料無料") ||
    text.includes("送料込み") ||
    text.includes("出品者負担")
  );
}

function getCategoryClass(category) {
  return String(category).includes("ブランド")
    ? "brand"
    : "ladies";
}

function getPostageLabel(item) {
  if (isFreeShipping(item)) {
    return "送料無料";
  }

  if (item.postage !== null && item.postage !== "") {
    return "送料 " + formatYen(item.postage);
  }

  return item.postage_text || "送料不明";
}

function getFilterState() {
  return {
    query: ELEMENTS.q.value.trim().toLowerCase(),
    category: ELEMENTS.category.value,
    minBids: Number(ELEMENTS.minBids.value || 0),
    shipping: ELEMENTS.shipping.value,
    sort: ELEMENTS.sort.value
  };
}

function matchesFilters(item, filters) {
  const sellerIsVisible =
    !item.seller_id || !EXCLUDED_SELLERS.has(String(item.seller_id));

  const titleMatches =
    !filters.query ||
    String(item.title || "").toLowerCase().includes(filters.query);

  const categoryMatches =
    !filters.category ||
    item.category === filters.category;

  const bidsMatch =
    Number(item.bids || 0) >= filters.minBids;

  const freeShipping = isFreeShipping(item);

  const shippingMatches =
    !filters.shipping ||
    (filters.shipping === "free" && freeShipping) ||
    (filters.shipping === "paid" && !freeShipping);

  return (
    sellerIsVisible &&
    titleMatches &&
    categoryMatches &&
    bidsMatch &&
    shippingMatches
  );
}

function sortItems(items, sortType) {
  const rows = [...items];

  const sortFunctions = {
    bidsDesc: (a, b) =>
      Number(b.bids || 0) - Number(a.bids || 0),

    priceAsc: (a, b) =>
      (a.price ?? Infinity) - (b.price ?? Infinity),

    priceDesc: (a, b) =>
      (b.price ?? -1) - (a.price ?? -1)
  };

  const sortFunction = sortFunctions[sortType];

  if (sortFunction) {
    rows.sort(sortFunction);
  }

  return rows;
}

async function excludeSeller(buttonElement) {
  const card = buttonElement.closest(".card");
  const sellerId = String(card?.dataset.sellerId || "").trim();
  const productId = String(card?.dataset.productId || "").trim();
  const title = String(card?.dataset.title || "").trim();
  const itemUrl = String(card?.dataset.itemUrl || "").trim();

  if (!sellerId) {
    alert("この商品には出品者IDがありません。");
    return;
  }

  const confirmed = confirm(
    "この出品者を除外候補へ追加しますか？\n\n" +
    sellerId
  );

  if (!confirmed) {
    return;
  }

  buttonElement.disabled = true;
  buttonElement.textContent = "追加中…";

  const isLocal =
    location.hostname === "127.0.0.1" ||
    location.hostname === "localhost";

  try {
    if (isLocal) {
      const response = await fetch("/exclude-seller", {
        method: "POST",
        headers: {
          "Content-Type": "application/json"
        },
        body: JSON.stringify({
          seller_id: sellerId
        })
      });

      const result = await response.json();

      if (!response.ok || !result.ok) {
        throw new Error(
          result.message || "除外設定への追加に失敗しました。"
        );
      }

      EXCLUDED_SELLERS.add(sellerId);
      render();

      alert(
        result.already_exists
          ? "この出品者はすでに除外リストへ登録済みです。"
          : "PCの除外リストへ追加しました。"
      );
      return;
    }

    if (
      !EXCLUDE_CANDIDATE_ENDPOINT ||
      EXCLUDE_CANDIDATE_ENDPOINT.includes("PASTE_")
    ) {
      throw new Error(
        "Google Apps ScriptのURLが設定されていません。"
      );
    }

    await fetch(EXCLUDE_CANDIDATE_ENDPOINT, {
      method: "POST",
      mode: "no-cors",
      cache: "no-store",
      headers: {
        "Content-Type": "text/plain;charset=UTF-8"
      },
      body: JSON.stringify({
        type: "yahoo_exclude_candidate",
        seller_id: sellerId,
        product_id: productId,
        title: title,
        item_url: itemUrl,
        source_page: location.href,
        registered_at: new Date().toISOString()
      }),
      keepalive: true
    });

    EXCLUDED_SELLERS.add(sellerId);
    render();

    alert(
      "Googleスプレッドシートの除外候補へ送信しました。"
    );
  } catch (error) {
    buttonElement.disabled = false;
    buttonElement.textContent =
      "🚫 この出品者を今後表示しない";

    alert(
      "除外候補へ追加できませんでした。\n\n" +
      String(error)
    );
  }
}

function createCardHtml(item) {
  const freeShipping = isFreeShipping(item);
  const categoryClass = getCategoryClass(item.category);

  return `
    <article
      class="card"
      data-seller-id="${escapeHtml(item.seller_id || "")}"
      data-product-id="${escapeHtml(item.product_id || "")}"
      data-title="${escapeHtml(item.title || "")}"
      data-item-url="${escapeHtml(item.url || "")}"
    >
      <div class="image-box">
        <img
          src="${escapeHtml(item.image_url)}"
          alt="${escapeHtml(item.title)}"
          loading="lazy"
          decoding="async"
          onerror="handleImageError(this)"
        >

        <div class="badges">
          <span class="badge ${categoryClass}">
            ${escapeHtml(item.category)}
          </span>

          <span class="badge bid">
            入札 ${Number(item.bids || 0)}件
          </span>
        </div>
      </div>

      <div class="card-body">
        <div class="title">
          ${escapeHtml(item.title)}
        </div>

        <button
          class="copy-title"
          type="button"
          onclick="copyTitle(this)"
        >
          タイトルをコピー
        </button>

        <div class="price">
          ${formatYen(item.price)}
        </div>

        <div class="info-row">
          <span>
            ${escapeHtml(item.remaining_time || "残り時間不明")}
          </span>

          <span>
            ${escapeHtml(item.product_id || "")}
          </span>
        </div>

        <div class="postage ${freeShipping ? "free" : ""}">
          ${escapeHtml(getPostageLabel(item))}
        </div>

        <a
          class="open"
          href="${escapeHtml(item.url)}"
          target="_blank"
          rel="noopener noreferrer"
        >
          商品ページを開く
        </a>

        <button
          class="exclude-seller"
          type="button"
          ${item.seller_id ? "" : "disabled"}
          onclick="excludeSeller(this)"
        >
          ${item.seller_id
            ? "🚫 この出品者を今後表示しない"
            : "出品者IDなし"}
        </button>
      </div>
    </article>
  `;
}

function renderCards(rows) {
  ELEMENTS.grid.innerHTML = rows
    .map(createCardHtml)
    .join("");

  ELEMENTS.empty.style.display =
    rows.length ? "none" : "block";
}

function renderStats(rows) {
  const brandCount = rows.filter(
    item => String(item.category).includes("ブランド")
  ).length;

  const ladiesCount = rows.length - brandCount;
  const freeCount = rows.filter(isFreeShipping).length;

  ELEMENTS.stats.innerHTML = `
    <div class="stat">
      表示件数
      <b>${rows.length}</b>
    </div>

    <div class="stat">
      ブランド
      <b>${brandCount}</b>
    </div>

    <div class="stat">
      レディース
      <b>${ladiesCount}</b>
    </div>

    <div class="stat">
      送料無料
      <b>${freeCount}</b>
    </div>
  `;
}

function render() {
  const filters = getFilterState();

  const filteredItems = ITEMS.filter(
    item => matchesFilters(item, filters)
  );

  const sortedItems = sortItems(
    filteredItems,
    filters.sort
  );

  renderCards(sortedItems);
  renderStats(sortedItems);
}

function populateCategories() {
  const categories = [
    ...new Set(
      ITEMS
        .map(item => item.category)
        .filter(Boolean)
    )
  ].sort(
    (a, b) => a.localeCompare(b, "ja")
  );

  ELEMENTS.category.innerHTML =
    '<option value="">全カテゴリ</option>' +
    categories
      .map(category => (
        `<option value="${escapeHtml(category)}">` +
        `${escapeHtml(category)}` +
        "</option>"
      ))
      .join("");
}

function registerEventListeners() {
  ["category", "minBids", "shipping", "sort"].forEach(id => {
    ELEMENTS[id].addEventListener("change", render);
  });

  ELEMENTS.q.addEventListener("input", render);
}

function initializePage() {
  populateCategories();
  registerEventListeners();
  ELEMENTS.sources.textContent = SOURCES.join(" / ");
  render();
}

initializePage();
</script>
</body>
</html>
